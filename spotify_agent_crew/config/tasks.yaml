analyze_prompt:
  description: >
    Interpret the user’s playlist request and convert it into structured,
    actionable parameters. Identify genre, mood, energy level, era, themes,
    and any constraints such as playlist length, popularity level, or desired
    obscurity.

    The user request:
    {request}
  agent: researcher_agent
  expected_output: >
    A curated list of 10 seed artists that best represent the user’s intent
    and will serve as the foundation for track selection.

define_tracks:
  description: >
    Take the 10 seed artists from the researcher agent and retrieve their top
    or most relevant tracks using the available Spotify tools.
  agent: track_selector_agent
  expected_output: >
    A list of Spotify tracks URIs.

publish_playlist:
  description: >
    Assemble and publish the final playlist on Spotify using the provided API
    tools. Apply an appropriate title and description that matches the original user request.
    Ensure the playlist is created only once and avoid retrying tool calls if creation fails.
    
    The user request:
    {request}
  agent: playlist_publisher_agent
  expected_output: >
    The ID of the published playlist on Spotify.
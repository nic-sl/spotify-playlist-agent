[project]
name = "spotify-playlist-agent"
version = "0.1.0"
description = "An AI-assisted web app that builds Spotify playlists from a natural-language prompt. "
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "crewai[bedrock]>=1.7.1",
]

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Playlist Agent</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 2rem; }
        .card { max-width: 560px; margin: 0 auto; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; }
        .btn { display: inline-block; padding: 0.75rem 1rem; border-radius: 8px; color: white; text-decoration: none; background: #1DB954; border: none; cursor: pointer; font-weight: 600; }
        .btn:hover { filter: brightness(0.95); }
        .muted { color: #666; font-size: 0.95rem; }
    </style>
    </head>
<body>
    <div class="card">
        <h1>Spotify Playlist Agent</h1>
        <p class="muted">A tiny local app that starts with Spotify login and then takes you to a chat-like page.</p>

        <p>
            <a class="btn" href="/login">Login with Spotify</a>
        </p>

        {% if not spotify_configured %}
        <p class="muted">
            Provide <code>SPOTIFY_CLIENT_ID</code>, <code>SPOTIFY_CLIENT_SECRET</code>, and (optionally) <code>SPOTIFY_REDIRECT_URI</code> to enable real login.
        </p>
        {% endif %}
    </div>
</body>
</html>
